label: "serrurier"

gmb_contenu: "En situation d'urgence (serrure bloquée, porte claquée), le client choisit le premier serrurier visible sur Google Maps avec des avis rassurants. Votre fiche est votre outil de vente principal — chaque photo et chaque avis compte."
valeur_gmb_bloc1: "L'URGENCE JOUE EN VOTRE FAVEUR/Un client bloqué devant sa porte appelle le premier serrurier crédible sur Google Maps. Avec 50 avis et une fiche complète, vous êtes ce premier choix — pas le résultat d'une longue recherche, juste une décision immédiate."
valeur_gmb_bloc2: "LA CONFIANCE FILTRE LES MAUVAIS CLIENTS/Dans un secteur où les arnaques existent, les avis Google sont votre preuve de sérieux. Chaque avis positif attire des clients qui respectent vos tarifs et ne cherchent pas le moins cher."
valeur_gmb_bloc3: "PRÉSENCE LOCALE DOMINANTE/Être dans le top 3 sur 'serrurier [ville]' signifie capter la majorité des appels d'urgence de votre zone. Les confrères sans fiche optimisée ne verront jamais ces clients."

refonte_contenu: "Vos agréments, certifications et photos d'interventions mis en avant. Affichage clair de votre zone d'intervention et de vos tarifs indicatifs — les deux informations que cherche un client en urgence avant d'appeler."
valeur_bloc1: "LE CLIENT EN URGENCE APPELLE EN PREMIER/Un site clair avec vos certifications et votre numéro bien visible convertit mieux qu'un annuaire. Le client bloqué veut une réponse en 10 secondes — votre site la lui donne."
valeur_bloc2: "VOS TARIFS AFFICHÉS, MOINS DE LITIGES/Un serrurier qui affiche ses tarifs indicatifs filtre les mauvaises surprises. Le client arrive avec des attentes réalistes — la conversation commence sur de meilleures bases."
valeur_bloc3: "DOMINER VOTRE ZONE GÉOGRAPHIQUE/Un site bien référencé sur 'serrurier [ville]' capte les urgences que Google Maps ne vous envoie pas encore. Les deux canaux ensemble verrouillent votre présence locale."
site_contenu: "Vos agréments et assurances affichés dès la page d'accueil. Une section intervention rapide avec vos délais habituels, vos tarifs indicatifs et un bouton d'appel direct — tout ce qu'un client en urgence cherche avant de choisir son serrurier."
