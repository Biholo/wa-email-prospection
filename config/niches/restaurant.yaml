label: "restaurant"

gmb_contenu: "Les clients choisissent un restaurant sur Google Maps en regardant les photos de plats, la note globale et les avis récents. Votre fiche Google est votre menu numérique — et souvent la première chose qu'un client voit de vous."
valeur_gmb_bloc1: "LA RÉSERVATION SE FAIT DEPUIS GOOGLE/Un client qui voit vos photos de plats à 19h cherche à réserver pour le soir même. Un bouton de réservation sur votre fiche Google convertit l'envie en table réservée — sans qu'il aille chercher ailleurs."
valeur_gmb_bloc2: "LES AVIS RÉCENTS COMPTENT PLUS QUE LA NOTE GLOBALE/Un restaurant avec les 10 derniers avis à 5 étoiles est perçu comme en progression. Les clients font confiance à la tendance récente — chaque semaine sans nouvel avis vous fait perdre du terrain."
valeur_gmb_bloc3: "CAPTER LE TRAFIC DES TOURISTES ET NOUVEAUX HABITANTS/Les personnes qui découvrent votre ville cherchent 'restaurant [ville] [cuisine]' sur Google Maps. Une fiche complète et bien notée vous place en première suggestion — sans effort marketing supplémentaire."

refonte_contenu: "Photos professionnelles de vos plats et de votre salle, votre menu en ligne toujours à jour et un système de réservation directe. Une page qui donne envie avant même que le client arrive dans votre rue."
valeur_bloc1: "LES PHOTOS DE PLATS FONT VENIR LES CLIENTS/Un site avec des photos professionnelles de vos créations crée l'envie avant la visite. Les clients qui arrivent ont déjà choisi — ils savent ce qu'ils viennent manger."
valeur_bloc2: "COMMANDES EN LIGNE ET RÉSERVATIONS DIRECTES/Un site avec commandes à emporter et réservations en ligne capture le chiffre d'affaires que vous laissez sur la table. Le client qui hésite à appeler clique — et la réservation est faite."
valeur_bloc3: "RÉFÉRENCEMENT LOCAL POUR LES RECHERCHES D'ENVIE/Les personnes qui cherchent 'restaurant [cuisine] [ville]' ont une envie précise. Votre site qui répond à ces recherches capte des clients déjà décidés, prêts à réserver."
site_contenu: "Votre menu en ligne mis à jour régulièrement, des photos de plats et de salle qui donnent envie. Un système de réservation directe et de commande à emporter, et un référencement local sur 'restaurant [votre style] [votre ville]'."
