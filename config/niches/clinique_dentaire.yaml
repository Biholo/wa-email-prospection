label: "cabinet dentaire"

gmb_contenu: "Les patients cherchent un dentiste acceptant de nouveaux patients sur Google Maps. Vos photos de salle d'attente moderne, vos spécialités et vos avis positifs font la différence face aux cabinets concurrents."
valeur_gmb_bloc1: "ATTIRER LES NOUVEAUX PATIENTS EN CONTINU/Dans une ville où changer de dentiste est une décision importante, les patients consultent Google avant leur premier appel. 80 avis positifs avec des photos du cabinet suppriment les freins psychologiques."
valeur_gmb_bloc2: "VALORISER VOS ÉQUIPEMENTS ET SPÉCIALITÉS/Implantologie, orthodontie, blanchiment : chaque spécialité affichée sur votre fiche attire une demande précise. Vous captez les patients à forte valeur avant qu'ils trouvent un confrère spécialisé."
valeur_gmb_bloc3: "RÉDUIRE LES RENDEZ-VOUS NON HONORÉS/Un patient qui a choisi votre cabinet après avoir lu vos avis et vu vos photos est plus engagé. Il annule moins, il arrive à l'heure — et il recommande après son soin."

refonte_contenu: "Votre équipe présentée avec photos, vos équipements listés et votre politique d'acceptation de nouveaux patients clairement indiquée. Un formulaire de prise de rendez-vous en ligne intégré directement dans le site."
valeur_bloc1: "DES PATIENTS QUI VOUS CHOISISSENT, PAS L'INVERSE/Un site professionnel présente votre équipe, vos équipements et vos spécialités. Les patients arrivent confiants — et recommandent plus facilement car leur attente correspond à la réalité."
valeur_bloc2: "RÉSERVATION EN LIGNE = MOINS DE FRICTION/Un bouton de prise de rendez-vous visible réduit les abandons. Le patient qui hésite à appeler clique. Vous remplissez votre planning sans mobiliser votre secrétaire pour chaque question."
valeur_bloc3: "SPÉCIALITÉS VISIBLES = PATIENTS CIBLÉS/Implants, orthodontie, urgences : chaque mention sur votre site attire la bonne recherche Google. Vous captez des demandes précises, à forte valeur, que les cabinets sans site ne verront jamais."
site_contenu: "Votre équipe et vos équipements présentés en photos. Un formulaire de prise de rendez-vous en ligne, vos spécialités listées et votre politique d'accueil des nouveaux patients — tout ce qu'un futur patient consulte avant de choisir son dentiste."
