canal: EMAIL
step: 1
angle: RÉPUTATION
objet: "Ce qu'on a changé pour un {niche} comme vous"
message: |
  Bonjour {prenom},

  Suite à mon message de l'autre jour.

  On accompagne des {niche} qui avaient
  exactement la même situation que vous.

  Moins bien notés que leurs concurrents.
  Moins de demandes entrantes.
  Pourtant meilleurs dans leur métier.

  Ce qu'on a fait :
  Identifié pourquoi les clients
  les trouvaient eux en premier.
  Corrigé ça.
  Les demandes sont revenues.

  Ça prend 8 à 12 semaines.
  Et ça se ressent dès le premier mois.

  20 minutes cette semaine pour regarder
  votre situation ensemble ?
