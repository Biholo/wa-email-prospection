canal: EMAIL
step: 0
sequence: 1/3
angle: RÉPUTATION
note: >
  Premier email de la séquence réputation. Objectif : montrer l'écart
  de notation avec un concurrent précis, sans agressivité. On observe,
  on constate, on pose la question. Personnalisation forte requise :
  note et nombre d'avis du concurrent à renseigner.

niches:

  - label: Électricien
    key: electricien
    variables:
      - "{prenom}"
      - "{company}"
      - "{ville}"
      - "{concurrent_1_nom}"
      - "{concurrent_1_note}"
      - "{concurrent_1_nb_avis}"
    objet:
      - "Google Maps et {company} : une observation"
      - "J'ai comparé {company} avec {concurrent_1_nom}"
      - "Vos avis Google vs {concurrent_1_nom}"
    message: |
      Bonjour {prenom},

      En faisant une veille sur les électriciens de {ville} sur Google Maps,
      j'ai comparé {company} avec {concurrent_1_nom}.

      {concurrent_1_nom} affiche {concurrent_1_note}/5
      avec {concurrent_1_nb_avis} avis.

      Ce type d'écart, même léger, peut suffire à orienter
      un client hésitant vers le concurrent, avant même qu'il
      ait eu le réflexe de vous appeler.

      C'est quelque chose que vous avez déjà eu l'occasion de travailler ?

      Bonne journée,
      

