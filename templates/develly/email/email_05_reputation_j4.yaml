canal: EMAIL
step: 1
sequence: 2/3
angle: RÉPUTATION
note: >
  Deuxième email de la séquence réputation, envoyé à J+4 sans réponse.
  Objectif : montrer que l'écart est rattrapable, apporter la preuve sociale,
  expliquer le mécanisme sans jargon. Ne pas répéter la note ni le concurrent
  mentionné en J0. On passe de "voici le problème" à "voici comment on le règle".

niches:

  - label: Électricien
    key: electricien
    variables:
      - "{prenom}"
    objet:
      - "Cet écart se rattrape plus vite qu'on ne le pense"
      - "Comment d'autres électriciens ont rattrapé leur retard sur les avis"
      - "La bonne nouvelle sur votre réputation Google"
    context: |
      Email précédent envoyé à ce prospect :
      {message_j0}

      Ne pas répéter la note ni le nom du concurrent.
      J4 montre que c'est rattrapable et explique le mécanisme.
    message: |
      Bonjour {prenom},

      Je reviens vers vous avec une bonne nouvelle.

      Ce type d'écart sur les avis Google se rattrape bien plus vite
      qu'on ne le pense, à condition de mettre en place le bon process.

      Ce qu'on fait avec les électriciens qu'on accompagne :
      on optimise la fiche Google My Business, on met en place
      un système simple pour collecter des avis après chaque chantier,
      et on s'assure que le site vitrine travaille dans le même sens.

      L'effet est cumulatif. En quelques mois, la réputation en ligne
      reflète vraiment le niveau de travail sur le terrain.

      Si vous souhaitez qu'on en parle 15 minutes, je suis disponible.
      Et si ce n'est pas le bon moment, aucun problème.

      Bonne journée,
      

