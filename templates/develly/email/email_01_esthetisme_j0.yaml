canal: EMAIL
step: 0
sequence: 1/3
angle: ESTHÉTISME
note: >
  Premier email de la séquence. Objectif : créer la curiosité et planter
  le problème visuel sans agressivité commerciale. Pas de lien, pas de CTA
  forcé. On observe, on constate, on ouvre une porte.

niches:

  - label: Électricien
    key: electricien
    variables:
      - "{prenom}"
      - "{company}"
      - "{ville}"
      - "{concurrent_1_nom}"
      - "{concurrent_2_nom}"
    objet:
      - "Une observation rapide sur {company}"
      - "J'ai regardé votre site ce matin"
      - "{company} vs les électriciens de {ville}"
    message: |
      Bonjour {prenom},

      En faisant une veille sur les électriciens de {ville},
      j'ai comparé le site de {company} avec ceux de
      {concurrent_1_nom} et {concurrent_2_nom}.

      Ce qui m'a frappé : un client qui hésite entre deux électriciens
      ne choisit pas forcément le meilleur technicien.
      Il choisit celui dont le site lui a inspiré le plus confiance.

      Certifications visibles, chantiers mis en avant, formulaire de devis clair :
      ce sont des détails qui font basculer la décision avant même le premier appel.

      C'est quelque chose que vous avez déjà eu l'occasion de travailler ?

      Bonne journée,
      

