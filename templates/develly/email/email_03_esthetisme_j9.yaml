canal: EMAIL
step: 2
sequence: 3/3
angle: ESTHÉTISME
note: >
  Troisième et dernier email de la séquence, envoyé à J+9 sans réponse.
  Objectif : closing court et sans pression. On ne ressasse pas les emails
  précédents. On laisse une porte ouverte proprement et on sort de la
  séquence avec élégance. Ton très sobre, aucune insistance.

niches:

  - label: Électricien
    key: electricien
    variables:
      - "{prenom}"
      - "{company}"
    objet:
      - "Dernier message de ma part"
      - "Je ferme le dossier {company}"
      - "Une dernière chose avant de partir"
    context: |
      Emails précédents envoyés à ce prospect :
      {message_j0} / {message_j4}

      Ne pas répéter les arguments des emails précédents.
      Email court, sobre, sans pression. On laisse une porte ouverte
      et on sort proprement de la séquence.
    message: |
      Bonjour {prenom},

      Je ne vais pas vous relancer au-delà de ce message.

      Si le sujet n'est pas une priorité pour {company} en ce moment,
      c'est tout à fait normal, et je comprends.

      Si jamais la question d'un site qui reflète mieux votre niveau
      revient sur la table dans les prochains mois, n'hésitez pas
      à me contacter directement.

      Bonne continuation,
      

