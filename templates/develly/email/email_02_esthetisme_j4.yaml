      Email précédent envoyé à ce prospect :
      {message_j0}

      Ne pas répéter la comparaison avec les concurrents.
      J4 apporte la valeur et la preuve sociale sans ressasser J0.
    message: |
      Bonjour {prenom},

      Je reviens vers vous avec un point concret.

      Les cliniques dentaires avec qui on travaille avaient souvent
      le même frein : une forte dépendance à Doctolib pour les
      nouveaux patients, avec la data qui reste dans les mains
      de la plateforme.

      Un site bien construit change l'équation : les patients
      arrivent via Google, voient l'équipe, lisent les avis,
      comprennent les soins proposés, et prennent RDV directement.
      Moins de dépendance, meilleure relation dès le départ.

      On observe aussi une hausse des demandes pour les actes
      à forte valeur (implants, esthétique) quand ils sont
      bien mis en avant sur le site.

      Si vous souhaitez qu'on en parle 15 minutes, je suis disponible.
      Et si ce n'est pas le bon moment, aucun problème.

