    message: |
      Bonjour {prenom},

      Je reviens vers vous avec un point concret.

      Les hôtels avec qui on travaille avaient souvent le même
      problème : un site institutionnel qui n'inspirait pas vraiment
      le désir, et une dépendance forte aux OTA qui captaient
      l'essentiel des réservations.

      Un site qui vend l'expérience avant la chambre change
      la dynamique. Le visiteur ressent quelque chose, il imagine
      son séjour, et il réserve en direct plutôt que de chercher
      le meilleur prix sur Booking.

      Ce qu'on observe après la refonte : une hausse des réservations
      directes, une meilleure marge, et une valeur perçue plus haute
      qui soutient les tarifs.

      Si vous souhaitez qu'on en parle 15 minutes, je suis disponible.
      Et si ce n'est pas le bon moment, aucun problème.

