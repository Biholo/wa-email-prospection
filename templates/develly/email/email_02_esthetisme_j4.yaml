    message: |
      Bonjour {prenom},

      Je reviens vers vous avec un point concret.

      Les garages indépendants avec qui on travaille faisaient face
      au même défi : tenir tête aux réseaux nationaux (Midas, Speedy,
      Norauto) qui ont des sites léchés et des budgets pub importants.

      La réponse n'est pas d'imiter, c'est de jouer la carte du local
      et de l'humain. Équipe visible, spécialités claires, avis clients
