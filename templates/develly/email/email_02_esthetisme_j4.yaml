canal: EMAIL
step: 1
sequence: 2/3
angle: ESTHÉTISME
note: >
  Deuxième email de la séquence, envoyé à J+4 sans réponse au premier.
  Objectif : apporter de la valeur concrète, montrer ce que ça change
  en pratique. On ne répète pas le problème visuel de J0, on montre
  le mécanisme et la preuve sociale. Toujours sans pression.

niches:

  - label: Électricien
    key: electricien
    variables:
      - "{prenom}"
      - "{company}"
      - "{ville}"
    objet:
      - "Ce que ça change concrètement"
      - "Pourquoi certains électriciens convertissent mieux en ligne"
      - "Un point que peu d'électriciens travaillent"
    context: |
      Email précédent envoyé à ce prospect :
      {message_j0}

      Ne pas répéter la comparaison avec les concurrents.
      J4 apporte la valeur et la preuve sociale sans ressasser J0.
    message: |
      Bonjour {prenom},

      Je reviens vers vous avec un point concret.

      Les électriciens avec qui on travaille avaient souvent le même profil
      au départ : un bon carnet d'adresses, du bouche-à-oreille solide,
      mais un site qui ne reflétait pas vraiment leur niveau.

      Ce qu'on observe systématiquement après la refonte :
      moins de négociation sur les prix, parce que la valeur perçue
      est plus haute dès le départ. Les prospects arrivent mieux
      informés, mieux qualifiés, et moins enclins à comparer
      uniquement sur le tarif.

      Ce n'est pas de la magie, c'est simplement ce qui se passe
      quand un site fait vraiment le travail de conviction en amont.

      Si vous souhaitez qu'on en parle 15 minutes, je suis disponible.
      Et si ce n'est pas le bon moment, aucun problème.

      Bonne journée,
      

