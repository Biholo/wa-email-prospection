canal: EMAIL
step: 0
angle: ESTHÉTISME
objet: "Votre site donne-t-il confiance à vos clients ?"
message: |
  Bonjour {prenom},

  J'ai comparé la présence en ligne de {company}
  à celle de {concurrent_1_nom} et {concurrent_2_nom}.

  Ce que voit un client en 3 secondes sur Google :
  leur site inspire confiance. Le vôtre moins.

  Et au-delà de l'apparence,
  leur site répond immédiatement.
  Le vôtre prend du temps à charger.

  Un client qui hésite repart
  avant même d'avoir lu qui vous êtes.

  Ce n'est pas un jugement sur votre travail.
  C'est souvent l'inverse.
  Les meilleurs {niche} ont rarement
  le temps de soigner leur image en ligne.

  J'accompagne régulièrement des {niche}
  dans cette situation.

  On en parle ?
