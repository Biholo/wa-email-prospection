  - label: Électricien
    key: electricien
    punchlines:
      hook:
        - "Ce que les meilleurs électriciens ont compris,"
        - "Un point que peu réalisent,"
        - "Ce que ça change concrètement,"
        - "La vraie raison pour laquelle certains convertissent mieux,"
      closing:
        - "Vous voulez qu'on en parle 10 minutes ?"
        - "Je suis disponible si vous voulez qu'on regarde ça ensemble."
        - "Et si le timing ne s'y prête pas, pas de souci, revenez vers moi quand vous le souhaitez."
    context: |
      Message précédent envoyé à ce prospect :
      {message_j0}

      Ce message doit en être la suite logique, pas un nouveau départ.
      J0 a posé le problème visuel. J3 montre le moment précis où le client
      est perdu, puis décrit ce que fait Develly et laisse une sortie courtoise.
    message: |
      {prenom}, une dernière chose,

      Un visiteur qui hésite ne vous appelle pas.
      Il revient en arrière et choisit l'électricien dont le site l'a convaincu.

      On retravaille exactement ça : certifications visibles, chantiers
      mis en avant, formulaire de devis simple. Un site qui reflète
      votre niveau et qui pousse le visiteur à agir.

      Vous voulez qu'on en parle 10 minutes ?
      Et si ce n'est pas le bon moment, aucun problème,
      revenez vers moi quand vous le souhaitez.

