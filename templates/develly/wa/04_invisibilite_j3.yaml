canal: WHATSAPP
step: 1
angle: INVISIBILITÉ
niches:
  - label: Électricien
    key: electricien
    punchlines:
      hook:
        - "Ce que peu d'électriciens réalisent,"
        - "Un détail qui change tout,"
        - "Ce que vos concurrents ont compris,"
        - "La vraie raison pour laquelle les appels passent ailleurs,"
      closing:
        - "Vous voulez qu'on en parle 10 minutes ?"
        - "Si c'est quelque chose que vous souhaitez régler, je suis disponible."
        - "Et si le timing ne s'y prête pas, pas de souci, revenez vers moi quand vous le souhaitez."
    context: |
      Message précédent envoyé à ce prospect :
      {message_j0}

      Ce message doit en être la suite logique, pas un nouveau départ.
      J0 a posé le problème (pas de site, invisible, perte de clients).
      J3 ne répète pas le problème, il apporte la preuve sociale et la solution.
      Format obligatoire : hook → corps (1-2 phrases) → closing.
    message: |
      {prenom}, une dernière chose,

      On a accompagné beaucoup d'électriciens qui n'avaient pas de site.
      En quelques semaines, ils apparaissaient sur Google et recevaient
      leurs premiers appels locaux.

      On s'occupe de tout : création, référencement, maintenance.

      Vous voulez qu'on en parle 10 minutes ?
      Et si ce n'est pas le bon moment, aucun problème,
      revenez vers moi quand vous le souhaitez.

