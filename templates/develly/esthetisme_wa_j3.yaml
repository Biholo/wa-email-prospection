canal: WHATSAPP
step: 1
angle: ESTHÉTISME
punchlines:
  hook:
    - "Ce que les meilleurs {niche} ont compris,"
    - "Un point que peu réalisent,"
    - "Ce que ça change concrètement,"
    - "La vraie raison pour laquelle certains convertissent mieux,"
  closing:
    - "Vous voulez qu'on en parle 10 minutes ?"
    - "Je suis disponible si vous voulez qu'on regarde ça ensemble."
    - "Et si le timing ne s'y prête pas, je le comprends tout à fait — n'hésitez pas à revenir vers moi quand vous le souhaitez."
message: |
  {prenom} une dernière chose,

  Un visiteur qui hésite ne vous appelle pas.
  Il revient en arrière et choisit celui dont le site l'a convaincu.
  Vous perdez ce client sans même savoir qu'il est passé.

  Ce qu'on fait concrètement : on repense le site pour qu'il reflète
  vraiment votre travail, rassure le visiteur et le pousse à agir.
  On s'occupe ensuite de la maintenance et du référencement pour
  que ça dure dans le temps.

  Si ça peut avoir du sens pour {company}, je suis disponible pour en parler
  10 minutes. Et si ce n'est pas le bon moment, je le comprends tout à fait,
  n'hésitez pas à revenir vers moi quand vous le souhaitez.
context: |
  Message précédent envoyé à ce prospect :
  {message_j0}

  Ce message doit en être la suite logique, pas un nouveau départ.
  J0 a posé le problème visuel. J3 montre le moment précis où le client
  est perdu, puis décrit ce que fait Develly et laisse une sortie courtoise.