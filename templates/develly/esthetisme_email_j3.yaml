canal: EMAIL
step: 1
angle: ESTHÉTISME
objet: "Ce qu'on a changé pour des {niche} comme vous"
message: |
  Bonjour {prenom},

  Suite à mon message de l'autre jour.

  On accompagne des {niche} qui avaient
  exactement la même situation que vous.

  Une image en ligne qui ne reflétait pas
  la qualité de leur travail.
  Des clients qui choisissaient un concurrent
  avant même de les appeler.

  Ce qu'on a fait :
  Repensé leur présence pour inspirer confiance.
  Rendu leur site rapide et agréable à utiliser.
  Sans changer leur façon de travailler.

  Les clients ont commencé à les contacter
  différemment, avec plus de confiance
  dès le premier échange.

  On s'occupe de tout, de A à Z.
  Vous n'avez rien à gérer.

  20 minutes cette semaine pour en parler ?
