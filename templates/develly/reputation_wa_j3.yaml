canal: WHATSAPP
step: 1
angle: RÉPUTATION
punchlines:
  hook:
    - "Ce que peu de {niche} réalisent,"
    - "Un point que beaucoup négligent,"
    - "Ce que les mieux notés ont fait,"
    - "La vraie raison pour laquelle certains décrochent plus d'appels,"
  closing:
    - "Vous voulez qu'on en parle 10 minutes ?"
    - "Si c'est quelque chose qui vous parle, n'hésitez pas à me le faire savoir."
    - "Et si le timing ne s'y prête pas, pas de souci, revenez vers moi quand vous le souhaitez."
message: |
  {prenom}, une dernière chose,

  Ce genre d'écart se rattrape plus vite qu'on ne le pense.
  On a accompagné des {niche} qui étaient dans la même situation,
  quelques mois plus tard ils recevaient plus d'appels.

  Si vous voulez qu'on regarde ça ensemble, je suis disponible 10 minutes.
  Et si le timing ne s'y prête pas, pas de souci, revenez vers moi quand vous le souhaitez.
context: |
  Message précédent envoyé à ce prospect :
  {message_j0}

  Ce message doit en être la suite logique, pas un nouveau départ.
  J0 a montré l'écart de notation. J3 prouve que c'est rattrapable
  avec un cas concret et laisse une sortie courtoise.
  Ne pas répéter : la comparaison concurrents, la note, ni "fiche Google, avis, présentation".