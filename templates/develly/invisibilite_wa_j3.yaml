canal: WHATSAPP
step: 1
angle: INVISIBILITÉ
punchlines:
  hook:
    - "Ce que peu de {niche} réalisent,"
    - "Un détail qui change tout,"
    - "Ce que vos concurrents ont compris,"
    - "La vraie raison pour laquelle les demandes passent ailleurs,"
  closing:
    - "Si c'est quelque chose que vous souhaitez régler, je suis disponible pour en parler quand vous le souhaitez."
    - "Si le timing ne s'y prête pas, pas de souci, revenez vers moi quand vous le souhaitez."
    - "Si c'est quelque chose qui vous parle, n'hésitez pas à me le faire savoir."
message: |
  {prenom}, une dernière chose,

  On a accompagné beaucoup de {niche} qui n'avaient pas de site.
  En quelques semaines, ils apparaissaient sur Google et recevaient
  leurs premiers contacts locaux.

  On s'occupe de tout : création, référencement, maintenance.

  Vous voulez qu'on en parle 10 minutes ?
  Et si ce n'est pas le bon moment, aucun problème, revenez vers moi quand vous le souhaitez.
context: |
  Message précédent envoyé à ce prospect :
  {message_j0}

  Ce message doit en être la suite logique, pas un nouveau départ.
  J0 a posé le problème (pas de site, invisible, perte de clients).
  J3 ne répète pas le problème, il apporte la preuve sociale et la solution.
  Format obligatoire : hook → corps (1-2 phrases) → closing.